version: "2"

services:
  zookeeper:
    image: docker.io/bitnami/zookeeper:3.9
    ports:
      - "2181:2181"
    volumes:
      - "{{WORK_DIR}}/.data/zk:/bitnami"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
  kafka1:
    image: docker.io/bitnami/kafka:3.4
    ports:
      - "19092:19092"
      - "19094:19094"
    volumes:
      - "{{WORK_DIR}}/.data/b1:/bitnami"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=INTERNAL://:19092,EXTERNAL://:19094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka1:19092,EXTERNAL://localhost:19094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CLIENT_USERS=kafka_client_user
      - KAFKA_CLIENT_PASSWORDS=kafka_client_password
      - KAFKA_INTER_BROKER_USER=kafka_inner_broker_user
      - KAFKA_INTER_BROKER_PASSWORD=kafka_inner_broker_password
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
  kafka2:
    image: docker.io/bitnami/kafka:3.4
    ports:
      - "29092:29092"
      - "29094:29094"
    volumes:
      - "{{WORK_DIR}}/.data/b2:/bitnami"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:29094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka2:29092,EXTERNAL://localhost:29094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CLIENT_USERS=kafka_client_user
      - KAFKA_CLIENT_PASSWORDS=kafka_client_password
      - KAFKA_INTER_BROKER_USER=kafka_inner_broker_user
      - KAFKA_INTER_BROKER_PASSWORD=kafka_inner_broker_password
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - kafka1
  kafka3:
    image: docker.io/bitnami/kafka:3.4
    ports:
      - "39092:39092"
      - "39094:39094"
    volumes:
      - "{{WORK_DIR}}/.data/b3:/bitnami"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=INTERNAL://:39092,EXTERNAL://:39094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka3:39092,EXTERNAL://localhost:39094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CLIENT_USERS=kafka_client_user
      - KAFKA_CLIENT_PASSWORDS=kafka_client_password
      - KAFKA_INTER_BROKER_USER=kafka_inner_broker_user
      - KAFKA_INTER_BROKER_PASSWORD=kafka_inner_broker_password
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - kafka2
  kafka4:
    image: docker.io/bitnami/kafka:3.4
    ports:
      - "49092:49092"
      - "49094:49094"
    volumes:
      - "{{WORK_DIR}}/.data/b4:/bitnami"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=INTERNAL://:49092,EXTERNAL://:49094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka4:49092,EXTERNAL://localhost:49094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CLIENT_USERS=kafka_client_user
      - KAFKA_CLIENT_PASSWORDS=kafka_client_password
      - KAFKA_INTER_BROKER_USER=kafka_inner_broker_user
      - KAFKA_INTER_BROKER_PASSWORD=kafka_inner_broker_password
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - kafka3
  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      - kafka4
    volumes:
      - {{WORK_DIR}}/kafka-ui.yml:/etc/kafkaui/dynamic_config.yaml
